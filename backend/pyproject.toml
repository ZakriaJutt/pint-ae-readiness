[project]
name = "pintae-backend"
version = "0.1.0"
description = "PINT AE Readiness Desk: API, worker and packages (B1 foundation)"
requires-python = ">=3.12,<3.13"

[tool.pytest.ini_options]
pythonpath = [
  "../apps/api",
  "../apps/worker",
  "../packages/core",
  "../packages/rules",
  "../packages/rulepacks",
  "../packages/ingest",
  "..",
]
testpaths = ["tests"]
markers = [
  "db: needs the pintae_test database",
]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["../apps/api", "../apps/worker", "../packages/core", "../packages/rules", "../packages/rulepacks", "../packages/ingest"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "RUF", "SIM", "DTZ"]
ignore = ["E501", "S101", "S608", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311", "S603", "DTZ001"]
"../scripts/**" = ["S603", "S607"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "../apps/api:../apps/worker:../packages/core:../packages/rules:../packages/rulepacks:../packages/ingest"
explicit_package_bases = true
namespace_packages = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["openpyxl.*", "defusedxml.*"]
ignore_missing_imports = true
